name: Test molecular design backend

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m py_compile backend/app.py
      - name: Run molecular design regression tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Verify website pages
        run: |
          test -f public/index.html
          test -f public/rdkit-workbench.html
          test -f public/workbench-guide.html
          test -f public/chemical-system-builder.html
