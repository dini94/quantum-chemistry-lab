
site_name: Quantum Chemistry Lab
site_description: Interactive learning modules for computational chemistry
site_url: ""

repo_name: quantum-chemistry-lab
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Gaussian & ORCA:
      - Overview: gaussian-orca/index.md
      - Theory: gaussian-orca/theory.md
      - Structure Building: gaussian-orca/structure-building.md
      - Input Builder: gaussian-orca/input-builder.md
      - Calculation Workflows: gaussian-orca/workflows.md
      - Results & Analysis: gaussian-orca/results-analysis.md
      - Publication Workflow: gaussian-orca/publication.md
      - Free Analysis Software: gaussian-orca/software-library.md
  - Learning Paths: learning-paths.md
  - Interactive Demo: simulator/index.md
  - About: about.md

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/demo.js
